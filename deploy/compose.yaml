services:
  db-mcp:
    build: ..
    image: db-mcp-server:local
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      WEB_LOCAL_ORIGINS: http://127.0.0.1:13000,http://localhost:13000
      DB_TYPE: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: mcp_demo
      DB_USER: mcp_reader
      DB_PASSWORD: change-me
      DB_ALLOWED_TABLES: customers,orders
    volumes:
      - db-mcp-data:/app/data

volumes:
  db-mcp-data:
